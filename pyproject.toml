[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myai-modernization"
version = "0.1.0"
description = "Experimental evidence-grounded AI modernization platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "typer>=0.12,<1",
  "rich>=13.9,<14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.7,<1",
  "mypy>=1.13,<2",
]

[project.scripts]
myai = "myai.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/myai"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src/myai", "tests"]
